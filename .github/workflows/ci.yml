name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  # New advisories appear without any change to this repository.
  schedule:
    - cron: "17 5 * * 1"

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Everything that runs on the host. Fast feedback comes before the jobs
  # that need a browser or a wasm toolchain download.
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@f50ab1ce44b2f120b2531407517fcbfb1d610fa5 # 1.96.1
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      # Broken intra-doc links and missing items fail here, not on docs.rs.
      - name: Docs
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: "-D warnings"

      # Each feature combination a consumer can pick must at least compile:
      # the host-side SSR build, and the browser build the site uses.
      - name: Feature builds
        run: |
          cargo check -p prose-core --locked
          cargo check -p prose-core --target wasm32-unknown-unknown --locked
          cargo check -p prose-yew --locked
          cargo check -p prose-yew --features ssr --locked
          cargo check -p prose-yew --features csr --target wasm32-unknown-unknown --locked

  # prose-yew's Edit mode is DOM code (contenteditable, focus, events). The
  # host cannot run it: tests/edit_dom.rs compiles to an empty binary there.
  # Here it is mounted in headless Chrome.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@f50ab1ce44b2f120b2531407517fcbfb1d610fa5 # 1.96.1
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # One source of truth: the runner must match the wasm-bindgen in
      # Cargo.lock, so read it from there (a Dependabot lockfile bump cannot
      # desynchronise it).
      - name: Read wasm-bindgen version from Cargo.lock
        id: wb
        run: |
          set -euo pipefail
          v="$(awk '$0 == "name = \"wasm-bindgen\"" { getline; gsub(/[^0-9.]/, ""); print; exit }' Cargo.lock)"
          [ -n "$v" ] || { echo "wasm-bindgen not found in Cargo.lock" >&2; exit 1; }
          echo "wasm-bindgen in Cargo.lock: $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: wasm-bindgen-cli@${{ steps.wb.outputs.version }}

      - name: Clippy (wasm32)
        run: cargo clippy -p prose-yew -p demo --target wasm32-unknown-unknown --features csr --all-targets --locked -- -D warnings

      # `--test '*'`, not a list of names: a new file under tests/ is covered
      # the moment it exists (a bare `cargo test -p ... --target
      # wasm32-unknown-unknown` also picks up the --lib target and dies on
      # `Exec format error` first).
      - name: Browser tests
        run: |
          set -euo pipefail
          if [ -n "${CHROMEWEBDRIVER:-}" ] && [ -x "${CHROMEWEBDRIVER}/chromedriver" ]; then
            export CHROMEDRIVER="${CHROMEWEBDRIVER}/chromedriver"
          else
            export CHROMEDRIVER="$(command -v chromedriver)"
          fi
          echo "chromedriver: ${CHROMEDRIVER}"
          cargo test -p prose-yew --target wasm32-unknown-unknown --features csr --locked --test '*'
          cargo test -p demo --target wasm32-unknown-unknown --locked --test '*'

  # The release demo build, served under the Pages sub-path and booted in a
  # browser. Catches a build or boot failure before the deploy workflow does.
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@f50ab1ce44b2f120b2531407517fcbfb1d610fa5 # 1.96.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: trunk@0.22.0-beta.2

      - name: Build demo
        working-directory: demo
        run: trunk build --release --public-url /ds-prose-rs/

      - name: Boot check
        run: scripts/smoke-demo.sh demo/dist /ds-prose-rs/

  # The Angular bridge, built and consumed the way a downstream app does it:
  # both npm packages are built and packed, checked, and the demo app installs
  # only the tarballs (no path alias into this repository) and is booted in a
  # browser. v1 is read-only: it mounts <OdrlProse>, not the edit mode.
  angular:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v4
        with:
          # Angular 20 (the demo) needs Node 20.19, 22.12 or newer; the
          # wrapper's tests use Node's built-in TypeScript stripping (22.18+).
          node-version: 22

      - name: Build and pack @ds-labs/prose-wasm and @ds-labs/prose-angular
        run: scripts/build-npm-packages.sh

      - name: Check the tarballs
        run: node scripts/check-npm-packages.mjs

      # The same command shape the release workflow uses, minus the upload
      # (needs no credentials). The leading "./" is required: npm reads
      # "dist-npm/x" as the GitHub shorthand "user/repo".
      - name: Dry-run the publish
        run: |
          npm publish ./dist-npm/prose-wasm --access public --dry-run
          npm publish ./dist-npm/prose-angular --access public --dry-run

      - name: Typecheck and test the wrapper
        working-directory: prose-angular
        run: |
          npm run typecheck
          npm test

      - name: Build the demo app from the tarballs
        working-directory: demo-angular
        run: |
          npm ci --no-audit --no-fund
          npm install --no-audit --no-fund --no-save ../dist-npm/tarballs/*.tgz
          npx ng build

      - name: Boot check
        run: scripts/smoke-demo.sh demo-angular/dist/demo-angular/browser /
        env:
          SMOKE_TITLE: ds-prose-rs Angular demo

  # Licences, advisories, banned or unknown sources: deny.toml.
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check
