name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  # New advisories appear without any change to this repository.
  schedule:
    - cron: "17 5 * * 1"

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Everything that runs on the host. Fast feedback comes before the jobs
  # that need a browser or a wasm toolchain download.
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@f50ab1ce44b2f120b2531407517fcbfb1d610fa5 # 1.96.1
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      # Broken intra-doc links and missing items fail here, not on docs.rs.
      - name: Docs
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: "-D warnings"

      # The workspace build turns on prose-core's turtle feature (prose-wasm
      # asks for it by default); prose-core alone is tested without it and
      # with it, and prose-wasm without it (the default npm build).
      - name: prose-core and prose-wasm with and without Turtle
        run: |
          cargo test -p prose-core --locked
          cargo test -p prose-core --features turtle --locked
          cargo test -p prose-wasm --no-default-features --locked

      # A time budget for strict validation (building the index, then one
      # large policy). Ignored in the debug run above, where it would measure
      # the wrong thing; here it runs optimised.
      - name: Strict validation time budget
        run: cargo test -p prose-core --release --locked --test validate_perf -- --ignored

      # Each feature combination a consumer can pick must at least compile:
      # the host-side SSR build, and the browser build the site uses.
      - name: Feature builds
        run: |
          cargo check -p prose-core --locked
          cargo check -p prose-core --target wasm32-unknown-unknown --locked
          cargo check -p prose-core --features turtle --target wasm32-unknown-unknown --locked
          cargo check -p prose-yew --locked
          cargo check -p prose-yew --features ssr --locked
          cargo check -p prose-yew --features csr --target wasm32-unknown-unknown --locked

  # prose-yew's Edit mode is DOM code (contenteditable, focus, events). The
  # host cannot run it: tests/edit_dom.rs compiles to an empty binary there.
  # Here it is mounted in headless Chrome.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@f50ab1ce44b2f120b2531407517fcbfb1d610fa5 # 1.96.1
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # One source of truth: the runner must match the wasm-bindgen in
      # Cargo.lock, so read it from there (a Dependabot lockfile bump cannot
      # desynchronise it).
      - name: Read wasm-bindgen version from Cargo.lock
        id: wb
        run: |
          set -euo pipefail
          v="$(awk '$0 == "name = \"wasm-bindgen\"" { getline; gsub(/[^0-9.]/, ""); print; exit }' Cargo.lock)"
          [ -n "$v" ] || { echo "wasm-bindgen not found in Cargo.lock" >&2; exit 1; }
          echo "wasm-bindgen in Cargo.lock: $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: wasm-bindgen-cli@${{ steps.wb.outputs.version }}

      - name: Clippy (wasm32)
        run: |
          cargo clippy -p prose-yew -p demo --target wasm32-unknown-unknown --features csr --all-targets --locked -- -D warnings
          cargo clippy -p prose-wasm --target wasm32-unknown-unknown --all-targets --locked -- -D warnings
          cargo clippy -p prose-wasm --no-default-features --target wasm32-unknown-unknown --all-targets --locked -- -D warnings

      # `--test '*'`, not a list of names: a new file under tests/ is covered
      # the moment it exists (a bare `cargo test -p ... --target
      # wasm32-unknown-unknown` also picks up the --lib target and dies on
      # `Exec format error` first).
      - name: Browser tests
        run: |
          set -euo pipefail
          if [ -n "${CHROMEWEBDRIVER:-}" ] && [ -x "${CHROMEWEBDRIVER}/chromedriver" ]; then
            export CHROMEDRIVER="${CHROMEWEBDRIVER}/chromedriver"
          else
            export CHROMEDRIVER="$(command -v chromedriver)"
          fi
          echo "chromedriver: ${CHROMEDRIVER}"
          cargo test -p prose-yew --target wasm32-unknown-unknown --features csr --locked --test '*'
          cargo test -p demo --target wasm32-unknown-unknown --locked --test '*'
          cargo test -p prose-wasm --target wasm32-unknown-unknown --locked --test '*'
          # The default npm file, without the Turtle reader.
          cargo test -p prose-wasm --no-default-features --target wasm32-unknown-unknown --locked --test '*'

  # The release demo build, served under the Pages sub-path (/demo/ of the
  # site) and booted in a browser. Catches a build or boot failure before the
  # deploy workflow does.
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@f50ab1ce44b2f120b2531407517fcbfb1d610fa5 # 1.96.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: trunk@0.22.0-beta.2

      - name: Build demo
        working-directory: demo
        run: trunk build --release --public-url /ds-prose-rs/demo/

      - name: Boot check
        run: scripts/smoke-demo.sh demo/dist /ds-prose-rs/demo/

  # The Angular bridge, built and consumed the way a downstream app does it:
  # both npm packages are built and packed, checked, and the demo app installs
  # only the tarballs (no path alias into this repository) and is booted in a
  # browser under its Pages sub-path (/demo-angular/ of the site). v1 is
  # read-only: it mounts <OdrlProse>, not the edit mode.
  #
  # This job also holds the whole site: it has both demos built, so it runs the
  # site tests, assembles site/dist as Pages does and checks the real tree in
  # headless Chrome (every page and both demos, 1280 and 400 px).
  angular:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          # wasm-pack builds the npm package (0.14 or newer: --profile);
          # Trunk builds the Yew demo that goes into the site tree.
          tool: trunk@0.22.0-beta.2,wasm-pack@0.15.0
      - uses: actions/setup-node@v4
        with:
          # Angular 20 (the demo) needs Node 20.19, 22.12 or newer; the
          # wrapper's tests use Node's built-in TypeScript stripping (22.18+).
          node-version: 22

      - name: Build and pack @ds-labs/prose-wasm and @ds-labs/prose-angular
        run: scripts/build-npm-packages.sh

      - name: Check the tarballs
        run: node scripts/check-npm-packages.mjs

      # The ds-prose-validate command: its arguments and exit codes with a
      # fake engine, then every exit code (0 to 3) through the bin npm links
      # from the packed wasm tarball.
      - name: Test the ds-prose-validate command
        run: |
          node --test scripts/test/*.test.mjs
          node scripts/test-cli-tarball.mjs

      # The same command shape the release workflow uses, minus the upload
      # (needs no credentials). The leading "./" is required: npm reads
      # "dist-npm/x" as the GitHub shorthand "user/repo".
      - name: Dry-run the publish
        run: |
          npm publish ./dist-npm/prose-wasm --access public --dry-run
          npm publish ./dist-npm/prose-angular --access public --dry-run

      - name: Typecheck and test the wrapper
        working-directory: prose-angular
        run: |
          npm run typecheck
          npm test

      - name: Build the demo app from the tarballs
        working-directory: demo-angular
        run: |
          npm ci --no-audit --no-fund
          npm install --no-audit --no-fund --no-save ../dist-npm/tarballs/*.tgz
          npx ng build --base-href /ds-prose-rs/demo-angular/

      - name: Boot check
        run: scripts/smoke-demo.sh demo-angular/dist/demo-angular/browser /ds-prose-rs/demo-angular/
        env:
          SMOKE_TITLE: ds-prose-rs Angular demo
          SMOKE_EXTRA: ""

      - name: Build the Yew demo for the site
        working-directory: demo
        run: trunk build --release --public-url /ds-prose-rs/demo/

      # The policy catalog, generated at build time from ds-odrl-compliance-rdf
      # and the W3C, EDC and Dataspace Protocol examples (nothing of them is
      # kept in this repository). Fails when a corpus case does not translate
      # or does not read.
      - name: Generate the compliance catalog
        run: scripts/build-catalog.sh

      # The generator, the contract tests that tie the docs to the sources, and
      # the browser tests of the stylesheet switch and the smoke script.
      - name: Site tests
        timeout-minutes: 10
        run: node --test --test-reporter=spec --test-timeout=240000 "site/test/*.test.mjs"

      - name: Assemble the site
        run: node site/build.mjs
        env:
          SITE_REQUIRE_CATALOG: "1"
          SITE_BASE: /ds-prose-rs/

      # Every page and both demos at 1280 and 400 px, light and dark; the
      # demos' switch, theme, example stylesheet and validation controls.
      - name: Layout check
        run: node site/test/layout-check.mjs site/dist /ds-prose-rs/
        env:
          LAYOUT_REQUIRE_CHROME: "1"

  # Licences, advisories, banned or unknown sources: deny.toml.
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check
