# Same Pages pattern as ds-shacl-form-rs / ds-honeycomb-editor-rs: pinned
# toolchain and Trunk, build_type "workflow", project-page public URL.
name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - "prose-core/**"
      - "prose-yew/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/smoke-demo.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@f50ab1ce44b2f120b2531407517fcbfb1d610fa5 # 1.96.1
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: trunk@0.22.0-beta.2
      - name: Test
        run: cargo test --workspace --locked
      # --public-url makes asset URLs resolve under /ds-prose-rs/ on a
      # GitHub project page; it also feeds index.html's <base>.
      - name: Build demo
        working-directory: demo
        run: trunk build --release --public-url /ds-prose-rs/
      # Never publish a demo whose wasm does not boot.
      - name: Boot check
        run: scripts/smoke-demo.sh demo/dist /ds-prose-rs/

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
