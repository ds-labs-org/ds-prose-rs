[package]
name = "prose-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../README.md"
description = "Reads ODRL JSON-LD and writes it as structured plain-language prose"
keywords = ["odrl", "json-ld", "policy", "prose"]

[dependencies]
# preserve_order is unified across the whole build: it also changes the host's
# own serde_json::Map ordering. Documented in README.md (Limits).
serde_json = { version = "1", features = ["preserve_order"] }
