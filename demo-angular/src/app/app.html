<main>
  <h1>ds-prose-rs Angular demo</h1>
  <p>
    The prose on the right is the Yew <code>&lt;OdrlProse&gt;</code> component, compiled to wasm and mounted by
    <code>&lt;ds-odrl-prose&gt;</code>. Edit the JSON-LD and it re-renders.
  </p>
  <div class="presets">
    @for (p of presets; track p.label) {
      <button type="button" (click)="json.set(p.json)">{{ p.label }}</button>
    }
  </div>
  <fieldset class="validation">
    <legend>Validation</legend>
    <div class="row">
      <label>
        <input type="checkbox" id="strict" [checked]="strict()" (change)="setStrict($any($event.target).checked)" />
        Strict
      </label>
      <label>
        <input type="checkbox" id="findings" [checked]="findings()" (change)="findings.set($any($event.target).checked)" />
        Show the findings under the prose
      </label>
      <span>
        <label for="profile">Profile</label>
        <select id="profile" (change)="chooseProfile($any($event.target).value)">
          <option value="">None</option>
          <option value="research">Research Data Profile (JSON-LD)</option>
        </select>
      </span>
    </div>
    <p class="hint" id="profile-note">{{ profileNote() }}</p>
    <p id="verdict" role="status">{{ verdict() }}</p>
  </fieldset>
  <div class="columns">
    <section>
      <label for="policy">ODRL JSON-LD</label>
      <textarea id="policy" rows="24" [value]="json()" (input)="json.set($any($event.target).value)"></textarea>
    </section>
    <section>
      <h2>Prose</h2>
      <ds-odrl-prose
        [json]="json()"
        [profile]="profileText()"
        [strict]="strict()"
        [showViolations]="findings()"
        (validationChange)="onReport($event)"
        (profileLoaded)="onProfileLoaded($event)"
        (profileError)="onProfileError($event)"
      />
    </section>
  </div>
</main>
